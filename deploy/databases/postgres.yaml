# PostgreSQL cluster: two databases (products, inventory) with per-service
# users. The operator generates credential Secrets pg-pguser-products and
# pg-pguser-inventory (keys: user, password, host, port, dbname, uri,
# pgbouncer-uri, ...). Apps connect through pgBouncer.
apiVersion: pgv2.percona.com/v2
kind: PerconaPGCluster
metadata:
  name: pg
  namespace: default
spec:
  crVersion: 3.0.0
  image: docker.io/percona/percona-distribution-postgresql:18.3-2
  postgresVersion: 18
  patroni:
    dynamicConfiguration:
      postgresql:
        parameters:
          pg_stat_statements.track: "all"
          track_io_timing: "on"
          # Self-heal orphaned transactions: a client killed mid-transaction
          # (e.g. a PHP-FPM worker hitting its request timeout) can otherwise
          # leave a server-side connection idle-in-transaction forever, holding
          # locks and pinning the xmin horizon. Roll such sessions back after 60s.
          idle_in_transaction_session_timeout: "60000"
  extensions:
    builtin:
      pg_stat_statements: true
  instances:
    - name: instance1
      replicas: 2
      # Coroot reads these Pod annotations (not Deployment/StatefulSet ones) to
      # scrape each Postgres instance directly as the 'monitoring' superuser.
      # Percona serves TLS, so sslmode=require.
      metadata:
        annotations:
          coroot.com/postgres-scrape: "true"
          coroot.com/postgres-scrape-port: "5432"
          coroot.com/postgres-scrape-param-sslmode: "require"
          coroot.com/postgres-scrape-credentials-secret-name: "pg-pguser-monitoring"
          coroot.com/postgres-scrape-credentials-secret-username-key: "user"
          coroot.com/postgres-scrape-credentials-secret-password-key: "password"
      dataVolumeClaimSpec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: "2"
          memory: 1Gi
  proxy:
    pgBouncer:
      replicas: 1
      image: docker.io/percona/percona-pgbouncer:1.25.1-1
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
  # The operator requires spec.backups. This lab keeps backups entirely
  # in-cluster (a PVC-backed pgBackRest repo, no object storage) so it needs no
  # cloud credentials. pgBackRest archives WAL continuously, and it can only
  # expire archived WAL that predates a retained backup — so it MUST have a
  # backup and a retention policy, or the repo fills with WAL forever. Keep a
  # single full backup (retention 1); expire then prunes WAL older than it. Run
  # the full twice a day so at most ~12h of WAL is retained between backups —
  # heavy scenarios (checkpointer, replication-lag) generate a lot of WAL.
  backups:
    pgbackrest:
      image: docker.io/percona/percona-pgbackrest:2.58.0-1
      global:
        repo1-retention-full: "1"
        repo1-retention-full-type: count
        # Force an immediate checkpoint at backup start instead of waiting up to
        # checkpoint_timeout (~5 min) for the next one.
        start-fast: "y"
      manual:
        repoName: repo1
        options:
          - --type=full
      repos:
        - name: repo1
          schedules:
            full: "0 3,15 * * *"
          volume:
            volumeClaimSpec:
              accessModes: [ReadWriteOnce]
              resources:
                # 30Gi: headroom for the first full backup while the
                # pre-retention WAL backlog is still present (expire reclaims it
                # afterward), plus room for WAL spikes from heavy scenarios.
                # Steady state is ~1 backup + up to ~12h of WAL.
                requests:
                  storage: 30Gi
  users:
    # Superuser used only by Coroot for database monitoring (reads
    # pg_stat_statements, pg_stat_activity, replication state). The operator
    # generates its credentials in the Secret pg-pguser-monitoring (keys: user,
    # password), referenced by the coroot.com/postgres-scrape-* annotations on
    # the instance pods above.
    - name: monitoring
      options: "SUPERUSER"
    - name: products
      databases:
        - products
    - name: inventory
      databases:
        - inventory
