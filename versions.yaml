# Single source of truth for image versions.
# CI tags service images with these versions; deploy manifests pin them.
# Bad-deploy variants publish their own (higher) tags declared in
# services/<svc>/variants/<name>/variant.yaml.

services:
  api-gateway: 1.0.0
  product-catalog: 1.0.0
  cart-service: 1.0.0
  order-service: 1.0.0
  review-service: 1.0.0
  payment-service: 1.0.0
  inventory-service: 1.0.0
  recommendation-service: 1.0.0
  fulfillment-service: 1.0.0
  load-generator: 1.0.0
  data-seeder: 1.0.0
  operator: 1.0.0

# Third-party pins (operators installed by scripts/deploy.sh via helm).
charts:
  pg-operator: 3.0.0        # Percona Operator for PostgreSQL
  pxc-operator: 1.20.0      # Percona Operator for MySQL (PXC)
  psmdb-operator: 1.23.0    # Percona Operator for MongoDB
  strimzi-kafka-operator: 1.1.0

images:
  postgres: docker.io/percona/percona-distribution-postgresql:18.3-2
  pgbouncer: docker.io/percona/percona-pgbouncer:1.25.1-1
  pxc: docker.io/percona/percona-xtradb-cluster:8.4.8-8.1
  haproxy: docker.io/percona/haproxy:2.8.18-1
  psmdb: docker.io/percona/percona-server-mongodb:7.0.39  # 8.x refuses kernel 6.19+ (SERVER-121912)
  valkey: docker.io/valkey/valkey:9.1.1-alpine
  otel-collector: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.158.0
