# Cuts one replica-set SECONDARY off the network so it can no longer reach its
# peers to pull the oplog. The member stays up and the agent still scrapes it
# (the partition is scoped to the mongod-to-mongod path, not the agent's scrape),
# so it self-reports SECONDARY while its applied optime freezes: replication lag
# climbs, and because its TCP connections to the other members die, Coroot
# attributes the lag to a network problem ("no network connectivity to a replica
# set peer") rather than to a slow disk or a lock. This is the network sibling of
# the fsyncLock scenario (which blocks apply via a lock, with connectivity fine).
# The other two members keep a majority, so the replica set stays writable and the
# primary is healthy; only the fenced member falls behind.
#
# PSMDB exposes no primary/secondary role label, so Chaos Mesh can only target a
# fixed pod (mongodb-rs0-0). Fencing the primary would instead force an election
# (a different scenario - mongo-primary-failover covers that), so a first action
# guarantees mongodb-rs0-0 is a secondary before the fence lands: it steps
# mongodb-rs0-0 down if it is currently the primary (a quick, controlled election
# among the other two), and no-ops if it is already a secondary. The step-down
# holds for 5 minutes, longer than the fence takes to apply, and once fenced the
# isolated member can never win an election anyway - so it stays a secondary for
# the whole run.
#
# Self-heals: Chaos Mesh's own duration is a dead-man switch, so the fence clears
# if the operator dies, and reverting removes the partition - the member reconnects,
# replays the oplog backlog, and its lag returns to ~0 (a full resync only if it was
# fenced longer than the oplog window). Credentials (the operator's built-in
# clusterAdmin user, which holds replSetStepDown) are read from process.env and
# never appear on the command line or in the logs.
apiVersion: rcalab.dev/v1alpha1
kind: FailureScenario
metadata:
  name: mongo-replica-network-fencing
  namespace: default
spec:
  displayName: MongoDB secondary fenced off the network (replication lag)
  description: >-
    Chaos Mesh partitions one MongoDB secondary (mongodb-rs0-0) from the other
    replica-set members, cutting its oplog-replication and heartbeat paths while
    the agent keeps scraping it. The member stays SECONDARY but stops replicating:
    its applied optime freezes, replication lag climbs, and because its TCP
    connections to the peers die, Coroot attributes the lag to a network problem
    ("no network connectivity to a replica set peer") rather than to a slow disk,
    a lock, or a busy engine. The other two members keep a majority, so the replica
    set stays writable and the primary is healthy; only the fenced member falls
    behind, so reads with readPreference secondaryPreferred that would have gone to
    it move to the remaining members. Because PSMDB has no role label and Chaos
    Mesh can only target a fixed pod, a first action guarantees mongodb-rs0-0 is a
    secondary before the fence (stepping it down only if it is currently primary),
    so the fence never turns into a failover. Reverting removes the partition and
    the member catches back up from the oplog (a full resync only if it was out
    longer than the oplog window).
  category: reliability
  severity: high
  duration: 15m
  expectedSymptoms:
    - replication lag for one MongoDB secondary (mongodb-rs0-0) climbs and stays high while the primary and the other members are healthy
    - Coroot attributes the lag to the network path - failing/dead connections between the fenced member and its peers - not to a slow disk, a lock, or a saturated engine
    - the fenced member stays SECONDARY (it is still up and scraped); the replica set keeps a majority (2 of 3) and stays writable
    - if the member stays fenced longer than the oplog window it is at risk of a full initial resync
    - onset and recovery track the partition; removing it lets the member reconnect, replay the oplog backlog, and lag returns to ~0
  actions:
    # 1. Guarantee mongodb-rs0-0 is a secondary before the fence: step it down if it
    #    is currently primary (holds for 5 min so it stays secondary until well after
    #    the fence lands), no-op if already a secondary. directConnection so the
    #    command targets rs0-0 specifically. Runs once and exits.
    - name: ensure-secondary
      type: Workload
      workload:
        name: mongo-fence-ensure-secondary
        image: percona/percona-server-mongodb:7.0.39
        concurrency: 1
        env:
          - name: MONGO_USER
            valueFrom:
              secretKeyRef:
                name: internal-mongodb-users
                key: MONGODB_CLUSTER_ADMIN_USER
          - name: MONGO_PW
            valueFrom:
              secretKeyRef:
                name: internal-mongodb-users
                key: MONGODB_CLUSTER_ADMIN_PASSWORD
        command:
          - mongosh
          - --nodb
          - --quiet
          - --eval
          - |
            const u = encodeURIComponent(process.env.MONGO_USER);
            const p = encodeURIComponent(process.env.MONGO_PW);
            const uri = `mongodb://${u}:${p}@mongodb-rs0-0.mongodb-rs0.default.svc.cluster.local:27017/admin?authSource=admin&directConnection=true`;
            try {
              // steps rs0-0 down for 300s if it is the primary; errors (caught) if
              // it is already a secondary - either way rs0-0 is a secondary after this
              Mongo(uri).getDB('admin').adminCommand({ replSetStepDown: 300, secondaryCatchUpPeriodSecs: 5, force: true });
              print('stepped mongodb-rs0-0 down (it was primary)');
            } catch (e) {
              print('mongodb-rs0-0 is already a secondary (step-down not needed)');
            }
    # 2. Partition mongodb-rs0-0 from the other replica-set members. Delayed so the
    #    step-down above has settled and rs0-0 is a stable secondary. Scoping the
    #    target to the mongod pods keeps the cut on the member-to-member path and off
    #    the agent's scrape path, so the lag and the dead peer connections stay
    #    observable. Chaos Mesh's own duration is a dead-man switch.
    - name: fence-member
      type: ChaosMesh
      delay: 30s
      chaosMesh:
        kind: NetworkChaos
        spec:
          action: partition
          mode: all
          selector:
            namespaces: [default]
            labelSelectors:
              statefulset.kubernetes.io/pod-name: mongodb-rs0-0
          direction: both
          target:
            mode: all
            selector:
              namespaces: [default]
              labelSelectors:
                app.kubernetes.io/replset: rs0
