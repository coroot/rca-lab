# Fences one replica-set member off the network: Chaos Mesh fully partitions
# mongodb-rs0-0 from the other two mongod pods, so it can neither pull the oplog
# nor exchange heartbeats with them. This is a replication FAILURE, not just lag:
# the member stops replicating entirely, the primary reports it as "(not
# reachable/healthy)", and if it stays fenced longer than the oplog window it
# falls off the oplog and needs a full initial resync. The other two members keep
# a majority (2 of 3) so the replica set stays writable - only the fenced member
# is cut out.
#
# The partition is scoped to the mongod pods (app.kubernetes.io/replset=rs0), so
# it cuts the replication/heartbeat path between members but NOT the Coroot
# agent's scrape path - the primary still reports the fenced member's state, so
# the failure stays visible. Coroot's availability check flags "member
# mongodb-rs0-0 is not reachable from the primary ... cannot replicate ... will
# require a full resync", distinguishing a fenced/failed member from one that is
# merely lagging (the fsyncLock scenario covers the lag case).
#
# The mechanism is a real Chaos Mesh network partition (not a fabricated metric)
# and self-heals: Chaos Mesh's duration is a dead-man switch, so the fence clears
# if the operator dies, and reverting removes the partition - the member re-syncs
# from the oplog and rejoins as a healthy SECONDARY (a full resync only if it was
# fenced longer than the oplog window).
#
# NOTE: PSMDB exposes no primary/secondary role label, so the fence targets a
# fixed pod (mongodb-rs0-0). Run it from steady state, when rs0-0 is a secondary;
# if a prior failover made rs0-0 the primary, fencing it forces an election first
# (the other two elect a new primary) and then rs0-0 rejoins fenced as a
# secondary - correct, but noisier. Re-run once roles have settled.
apiVersion: rcalab.dev/v1alpha1
kind: FailureScenario
metadata:
  name: mongo-replica-network-fencing
  namespace: default
spec:
  displayName: MongoDB secondary fenced off the network (replication failure)
  description: >-
    Chaos Mesh fully partitions one MongoDB member (mongodb-rs0-0) from the other
    two mongod pods, cutting both its oplog-replication and heartbeat paths. The
    member stops replicating entirely: the primary reports it as not reachable, and
    if it stays fenced longer than the oplog window it will need a full initial
    resync. This is a replication failure, not lag - the fsyncLock scenario covers
    the lag case. The other two members keep a majority, so the replica set stays
    writable and the primary is unaffected; only the fenced member is cut out, and
    reads with readPreference secondaryPreferred that would have gone to it move to
    the remaining members. Coroot flags the unreachable member and the resync risk.
    Reverting removes the partition and the member catches back up from the oplog
    (a full resync only if it was out longer than the oplog window).
  category: reliability
  severity: high
  duration: 15m
  expectedSymptoms:
    - one MongoDB member (mongodb-rs0-0) becomes unreachable from the primary and stops replicating - a replication failure, not merely lag
    - the replica set keeps a majority (2 of 3) so it stays writable and the primary is healthy; only the fenced member is cut out
    - the fenced member is at risk of a full initial resync if it stays out longer than the oplog window
    - the tell is a network partition on the member's replication/heartbeat path, not a slow disk or a busy engine - its own CPU, disk, tickets and cache are fine
    - onset and recovery track the partition; removing it lets the member re-sync from the oplog and rejoin as a healthy SECONDARY
  actions:
    # Fully partition mongodb-rs0-0 from the other replica-set members. Scoping the
    # target to the mongod pods keeps the cut on the member-to-member path and off
    # the agent's scrape path, so the primary keeps reporting the fenced member's
    # state and the failure stays observable. Chaos Mesh's own duration is a
    # dead-man switch.
    - name: fence-member
      type: ChaosMesh
      chaosMesh:
        kind: NetworkChaos
        spec:
          action: partition
          mode: all
          selector:
            namespaces: [default]
            labelSelectors:
              statefulset.kubernetes.io/pod-name: mongodb-rs0-0
          direction: both
          target:
            mode: all
            selector:
              namespaces: [default]
              labelSelectors:
                app.kubernetes.io/replset: rs0
