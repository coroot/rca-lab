# A "bad" query is shipped against the reviews collection: it filters on fields
# that are not indexed, so MongoDB has to scan every document in the ~1 GB
# collection to answer it (a COLLSCAN), examining millions of documents to return
# a handful. It runs with the SAME read preference as the review-service
# (secondaryPreferred), so the scans land on the very secondaries the app reads
# from and contend with it: the collection is twice the size of the WiredTiger
# cache, so the scans evict the app's hot working set and hammer those members'
# data disks.
# This is the single most common MongoDB performance problem: a missing index
# turns a cheap lookup into a full-collection scan. It is not an outage — the
# primary is up — but read I/O and operation latency climb for everyone sharing
# the database (the review-service), and the query-targeting ratio (documents
# examined per document returned) is enormous. A good tool should surface the
# offending query shape as a COLLSCAN with a huge examined:returned ratio and
# attribute the disk load and latency to it. The mechanism is a real unindexed
# query workload, not a fabricated metric. Reverting stops the queries and the
# disk load and latency subside; the real fix would be to add the missing index.
apiVersion: rcalab.dev/v1alpha1
kind: FailureScenario
metadata:
  name: sc-01
  namespace: default
spec:
  displayName: MongoDB unindexed query scanning the whole collection (missing index)
  description: >-
    A few concurrent queries filter the reviews collection on unindexed fields
    (rating / verified_purchase / helpful_count), so MongoDB cannot use an index
    and must scan every one of the ~6 million documents to answer each query —
    examining millions of documents to return almost none. Because the collection
    (~1 GB) is twice the size of the WiredTiger cache (0.5 GB) it does not fit in
    memory, so the scans read the collection from the data disk repeatedly and
    read I/O and operation latency climb for every client sharing the primary,
    including the review-service. Because the scans share the secondaries the
    review-service reads from and evict its cached working set, review-service
    read latency climbs and that propagates up to the api-gateway (higher p95/p99
    on the review endpoints). Nothing is down and no data changes; the database is
    just doing enormous amounts of pointless work because of a missing index.
    Reverting stops the query workload and latency recovers; the durable fix would
    be to add an index covering the filter.
  category: database
  icon: mongodb
  duration: 15m
  expectedSymptoms:
    - a MongoDB query shape shows a huge query-targeting ratio — millions of documents examined per document returned — with a COLLSCAN plan
    - read I/O and operation latency on the MongoDB secondaries serving reads climb while request rates are otherwise normal
    - review-service read latency rises (its cached working set is evicted by the scans on the same secondaries) and the api-gateway sees higher latency on the review endpoints — the impact propagates up the service map from the bad query
    - the tell is an unindexed query doing full-collection scans (documents examined greatly exceeds documents returned), not a slow disk on its own, a lock, or a connection storm
    - onset and recovery track the query workload; stopping it (or adding the missing index) removes the scans and the latency
  actions:
    # Concurrent unindexed scans on the same read path as the app
    # (readPreference=secondaryPreferred) so they contend with review-service reads
    # on the secondaries. Credentials are read from process.env inside the script
    # and never appear on the command line or in the logs. Deleting the Job on
    # revert stops the queries.
    - name: a1
      type: Workload
      workload:
        name: sc-01-w1
        image: percona/percona-server-mongodb:7.0.39
        # Enough concurrent scans to make the missing-index problem show up as
        # LATENCY, not an outage. The scans evict the review-service's working set
        # from the shared ~0.5 GB WiredTiger cache and compete for CPU on the
        # secondaries it reads from, so review-service p99 roughly doubles and that
        # propagates to the api-gateway - while the members stay healthy (the
        # tolerant health probes in deploy/databases/mongodb.yaml keep a busy-but-
        # alive member in the replica set instead of flapping it out, which would
        # otherwise turn this into a fake instability incident).
        concurrency: 10
        env:
          - name: MONGO_USER
            value: reviews
          - name: MONGO_PW
            valueFrom:
              secretKeyRef:
                name: mongodb-custom-user-secret
                key: reviews
        command:
          - mongosh
          - --nodb
          - --quiet
          - --eval
          - |
            const uri = `mongodb://${process.env.MONGO_USER}:${process.env.MONGO_PW}@mongodb-rs0:27017/reviews?replicaSet=rs0&authSource=reviews&readPreference=secondaryPreferred`;
            const db = Mongo(uri).getDB('reviews');
            while (true) {
              try {
                // none of these fields is indexed, so this is a full-collection scan
                // that examines every document and returns almost none
                db.reviews.find({
                  rating: 3,
                  verified_purchase: true,
                  helpful_count: { $gt: 100000000 },
                }).toArray();
              } catch (e) {
                // brief backoff on error (e.g. a transient election) before retrying
              }
              // small pause between scans so the load is sustained pressure rather
              // than an all-out CPU pin
              sleep(1000);
            }
