# Drives MongoDB WiredTiger cache eviction by reading a working set far larger
# than the cache, and loads the secondaries enough that it surfaces as an
# api-gateway latency anomaly. The reviews collection is ~1.4 GB on disk (plus
# ~0.8 GB of indexes) while the WiredTiger cache is only 0.5 GB. The workload runs
# concurrent large INDEXED range reads (a random ~4000-document slice of the
# created_at index) across the whole collection: each query reads thousands of
# uncached pages off disk (so application threads evict pages, including the
# review-service's hot working set) and spends real CPU fetching and serializing
# the result. Unlike the inefficient-query scenario, the plan is a normal IXSCAN -
# there is no missing index; the problem is that the working set does not fit in
# cache, so the fix is more cache/RAM, not an index.
#
# Because the reads use readPreference secondaryPreferred (the same as the
# review-service) they land on the very secondaries the review-service reads from,
# evict its cached pages, and compete with it for CPU and disk I/O there. The
# review-service's reads then miss the cache and queue behind the load, so its read
# latency roughly doubles and the api-gateway sees higher p95/p99 on the review
# endpoints. Nothing is down and no data changes. The tells are WiredTiger cache
# eviction plus a high cache-read-from-disk rate with normal indexed plans - a
# cache-size / working-set problem. Reverting stops the reads and the working set
# warms back up, so latency recovers.
apiVersion: rcalab.dev/v1alpha1
kind: FailureScenario
metadata:
  name: mongo-cache-eviction
  namespace: default
spec:
  displayName: MongoDB working set exceeds the WiredTiger cache (cache eviction)
  description: >-
    Concurrent large indexed range reads (a random ~4000-document slice of the
    created_at index) sweep the ~1.4 GB reviews collection, which is far larger than
    the 0.5 GB WiredTiger cache. Each query reads thousands of uncached pages off
    disk - so application threads evict pages, including the review-service's hot
    working set - and spends CPU fetching and serializing the result, loading the
    secondaries. The plan is a normal IXSCAN: there is no missing index; the problem
    is that the working set does not fit in cache, so the fix is more cache/RAM.
    Because the reads are secondaryPreferred they share the secondaries the
    review-service reads from, evict its cached pages, and compete for CPU and I/O
    there, so review-service read latency roughly doubles and the api-gateway sees
    higher p95/p99 on the review endpoints. Nothing is down and no data changes; the
    tells are cache eviction and a high cache-read-from-disk rate with normal indexed
    plans. Reverting stops the reads and the working set warms back up, so latency
    recovers.
  category: database
  severity: high
  duration: 15m
  expectedSymptoms:
    - MongoDB application threads are evicting WiredTiger cache pages and the cache-read-from-disk rate is high, while query plans stay indexed (IXSCAN, not COLLSCAN)
    - review-service read latency roughly doubles as its cached working set is evicted and it competes for CPU/I-O on the secondaries it reads from; the api-gateway sees higher p95/p99 on the review endpoints
    - the working set (~1.4 GB) simply does not fit the 0.5 GB WiredTiger cache - the tell is cache pressure (eviction + disk reads) with normal indexed plans, not a missing index or a slow query shape; the fix is more cache/RAM
    - the load is on the MongoDB secondaries (cache + CPU + disk), not the primary; writes are unaffected
    - onset and recovery track the workload; stopping it lets the review-service's working set warm back up and latency recovers
  actions:
    # Concurrent large indexed range reads across the whole reviews collection on the
    # same read path as the app (secondaryPreferred), so they evict the review-service's
    # working set from the shared 0.5 GB cache and compete for CPU/I-O on the same
    # secondaries. Credentials are read from process.env inside the script and never
    # appear on the command line or in the logs. Deleting the Job on revert stops the reads.
    - name: cache-thrash
      type: Workload
      workload:
        name: mongo-cache-thrash
        image: percona/percona-server-mongodb:7.0.39
        # concurrency chosen so the large random reads keep the 0.5 GB cache thrashing
        # and load the secondaries enough to move review-service (and thus api-gateway)
        # latency, without pinning mongod so hard the health probes flap.
        concurrency: 24
        env:
          - name: MONGO_USER
            value: reviews
          - name: MONGO_PW
            valueFrom:
              secretKeyRef:
                name: mongodb-custom-user-secret
                key: reviews
        command:
          - mongosh
          - --nodb
          - --quiet
          - --eval
          - |
            const u = process.env.MONGO_USER, p = process.env.MONGO_PW;
            const uri = `mongodb://${u}:${p}@mongodb-rs0:27017/reviews?replicaSet=rs0&authSource=reviews&readPreference=secondaryPreferred`;
            const db = Mongo(uri).getDB('reviews');
            // created_at spans ~2 years; pick a random point and read a large slice
            const START = new Date('2024-08-07T00:00:00Z').getTime();
            const SPAN = new Date('2026-08-27T00:00:00Z').getTime() - START;
            while (true) {
              try {
                // random large created_at range (uses created_at_-1): reads thousands
                // of docs from a random, uncached part of the collection - many pages
                // off disk (cache thrash) plus real CPU to fetch and serialize them,
                // so the secondaries the review-service reads from get loaded
                const before = new Date(START + Math.floor(Math.random() * SPAN));
                db.reviews.find({ created_at: { $lt: before } }).sort({ created_at: -1 }).limit(8000).toArray();
              } catch (e) {
                // brief backoff on a transient error (e.g. an election) before retrying
              }
            }
