# PostgreSQL cluster: two databases (products, inventory) with per-service
# users. The operator generates credential Secrets pg-pguser-products and
# pg-pguser-inventory (keys: user, password, host, port, dbname, uri,
# pgbouncer-uri, ...). Apps connect through pgBouncer.
apiVersion: pgv2.percona.com/v2
kind: PerconaPGCluster
metadata:
  name: pg
  namespace: default
spec:
  crVersion: 3.0.0
  image: docker.io/percona/percona-distribution-postgresql:18.3-2
  postgresVersion: 18
  patroni:
    dynamicConfiguration:
      postgresql:
        parameters:
          pg_stat_statements.track: "all"
          track_io_timing: "on"
  extensions:
    builtin:
      pg_stat_statements: true
  instances:
    - name: instance1
      replicas: 2
      dataVolumeClaimSpec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: "2"
          memory: 1Gi
  proxy:
    pgBouncer:
      replicas: 1
      image: docker.io/percona/percona-pgbouncer:1.25.1-1
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
  users:
    - name: products
      databases:
        - products
    - name: inventory
      databases:
        - inventory
