# MongoDB (Percona Server for MongoDB): 3-member replica set, database
# "reviews". The declarative user below gets a generated password in the
# Secret mongodb-custom-user-secret (key = username). The reviews database
# itself is created implicitly on first write.
apiVersion: psmdb.percona.com/v1
kind: PerconaServerMongoDB
metadata:
  name: mongodb
  namespace: default
spec:
  crVersion: "1.23.0"
  # MongoDB 7.0, not 8.x: the 8.x line refuses to start on Linux kernel
  # 6.19+ (MongoDB SERVER-121912), which breaks on modern host kernels
  # such as Ubuntu 26.04's 7.0. 7.0 is a supported LTS and has no such
  # check, so it runs on both old and new kernels.
  image: docker.io/percona/percona-server-mongodb:7.0.39
  replsets:
    - name: rs0
      size: 3
      # Coroot database monitoring: scrape each replica-set member as the
      # operator's built-in clusterMonitor user (credentials in the Secret
      # internal-mongodb-users).
      annotations:
        coroot.com/mongodb-scrape: "true"
        coroot.com/mongodb-scrape-port: "27017"
        coroot.com/mongodb-scrape-credentials-secret-name: "internal-mongodb-users"
        coroot.com/mongodb-scrape-credentials-secret-username-key: "MONGODB_CLUSTER_MONITOR_USER"
        coroot.com/mongodb-scrape-credentials-secret-password-key: "MONGODB_CLUSTER_MONITOR_PASSWORD"
      configuration: |
        storage:
          wiredTiger:
            engineConfig:
              cacheSizeGB: 0.5
        net:
          maxIncomingConnections: 500
      resources:
        requests:
          cpu: 250m
          memory: 1Gi
        limits:
          cpu: "2"
          memory: 2Gi
      volumeSpec:
        persistentVolumeClaim:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi
  users:
    - name: reviews
      db: reviews
      roles:
        - name: readWrite
          db: reviews
