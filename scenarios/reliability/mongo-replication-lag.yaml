# A MongoDB secondary's data disk becomes slow (Chaos Mesh IOChaos adds latency
# to every read/write under /data/db). WiredTiger on that member can no longer
# apply the primary's oplog fast enough, so the secondary falls behind: with the
# review-service writing continuously, replication lag climbs from seconds to
# minutes over the run. This is a reliability risk, not an outage: the primary is
# healthy and writes commit normally, but the lagging secondary serves
# increasingly stale reads (review-service reads with readPreference
# secondaryPreferred) and is a worse failover candidate — a failover now would
# lose the un-applied oplog, and if the lag approaches the oplog window the
# member needs a full resync. A good tool should flag the growing lag well before
# it matters, and point at the member's disk (not the network or the writes) as
# the cause. The mechanism is a real slow disk on the member, not a fabricated
# metric. Reverting removes the I/O latency and the secondary replays the backlog
# and catches up.
apiVersion: rcalab.dev/v1alpha1
kind: FailureScenario
metadata:
  name: mongo-replication-lag
  namespace: default
spec:
  displayName: MongoDB secondary falling behind (slow data disk)
  description: >-
    Chaos Mesh adds ~30ms of latency to every I/O on one MongoDB secondary's data
    volume (/data/db), simulating a degraded disk on that member. WiredTiger
    applies the replicated oplog from disk, so the slow disk throttles oplog
    apply: while the review-service writes reviews continuously, the secondary
    cannot keep up and its replication lag behind the primary grows over the run
    (from seconds into minutes). The primary and the other secondary are healthy
    and writes commit normally; the only problem is that this member is
    increasingly behind, so reads it serves are stale and the cluster's failover
    safety margin shrinks — if the lag approaches the oplog window the member
    would need a full initial sync. Reverting removes the I/O latency and the
    secondary replays the backlog and catches up.
  category: reliability
  severity: high
  duration: 20m
  expectedSymptoms:
    - MongoDB replication lag for one secondary grows over the run (seconds, then minutes behind the primary) while the primary and the other secondary stay healthy
    - the affected member applies the oplog slowly; reads it serves (secondaryPreferred) return increasingly stale data
    - the primary shows normal write throughput and no error rate — the problem is isolated to one secondary's ability to keep up, not the writes
    - the tell is the member's disk I/O latency, not the network or the database engine — its CPU and connection counts are normal
    - onset and recovery track the injected I/O latency; removing it lets the member replay the backlog and lag returns to ~0
  actions:
    # Degrade one secondary's data disk. Chaos Mesh's own duration is set by the
    # operator as a dead-man switch, so the fault self-heals if the operator dies.
    # The member is selected by name. PSMDB assigns the primary dynamically (no role
    # label to select on); rs0-1 is a secondary in the default topology. If a prior
    # failover promoted it, verify roles with rs.status() — a slow disk on any single
    # member is still a valid fault, the observed effect just shifts (a primary would
    # saturate rather than lag).
    - name: secondary-disk-latency
      type: ChaosMesh
      chaosMesh:
        kind: IOChaos
        spec:
          action: latency
          mode: one
          selector:
            namespaces: [default]
            pods:
              default: [mongodb-rs0-1]
          containerNames: [mongod]
          volumePath: /data/db
          path: /data/db/**
          delay: "30ms"
          percent: 100
