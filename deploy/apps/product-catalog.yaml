apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-catalog
  namespace: default
  labels:
    app: product-catalog
    part-of: rca-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-catalog
  template:
    metadata:
      labels:
        app: product-catalog
        part-of: rca-lab
    spec:
      containers:
        - name: product-catalog
          image: ghcr.io/coroot/rca-lab/product-catalog:1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: otel-env
          env:
            - name: OTEL_SERVICE_NAME
              value: product-catalog
            # Percona PG operator-generated credentials; connect via pgBouncer.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: pg-pguser-products
                  key: pgbouncer-uri
            - name: RECOMMENDATION_SERVICE_ADDR
              value: "recommendation-service:9000"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: product-catalog
  namespace: default
  labels:
    app: product-catalog
    part-of: rca-lab
spec:
  type: ClusterIP
  selector:
    app: product-catalog
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
