# Collapses the replica set's oplog window by churning a large volume of oplog
# bytes in a short time. The oplog is a fixed-size capped collection (~990 MB
# here); the "window" is the time span between its oldest and newest entries, so
# writing ~990 MB of new oplog quickly evicts all the old entries and the window
# shrinks from ~21 hours to a few minutes. A too-small oplog window is a classic
# silent reliability risk: any secondary that restarts, is taken down for
# maintenance, or briefly lags now has almost no room before it falls off the
# oplog and needs a full initial resync, and point-in-time recovery loses its
# margin. A good tool should flag the shrunken window well before that happens.
#
# The mechanism is deliberately high-BYTES / low-OPS: it inserts a small number
# of large (~256 KB) documents per second into a capped scratch collection. That
# pushes megabytes/second into the oplog (collapsing the window fast) while the
# operation rate stays around a dozen ops/second - far below the normal workload
# - so the secondaries apply it easily and do NOT themselves fall behind or
# resync (which would show up as instability instead of a clean oplog-window
# signal). The scratch collection is capped (bounded on disk) so the churn does
# not fill the data volume; only the oplog cycles.
#
# Recovery is intentionally gradual and realistic: when reverted the churn stops,
# but the window rebuilds only as normal writes slowly age the burst entries out,
# so it climbs back over roughly an hour (the alert clears once the window passes
# the 1h threshold again). Nothing is left locked or broken - the scratch
# collection is capped and harmless, and no resource stays held. Credentials are
# read from process.env inside mongosh and never appear on the command line or in
# the logs.
apiVersion: rcalab.dev/v1alpha1
kind: FailureScenario
metadata:
  name: mongo-oplog-window
  namespace: default
spec:
  displayName: MongoDB oplog window collapsing (write churn)
  description: >-
    Inserts a steady stream of large (~256 KB) documents into a capped scratch
    collection, pushing several megabytes per second into the oplog. Because the
    oplog is a fixed ~990 MB capped collection, this quickly evicts the old
    entries and the oplog window shrinks from ~21 hours to a few minutes and stays
    there while the churn runs - so Coroot's oplog-window check fires. The write
    rate is high in bytes but low in operations (~a dozen large inserts per
    second), so the secondaries apply it easily and stay caught up; the only
    problem is that the safety margin before a member would fall off the oplog
    (and need a full resync) has collapsed, and point-in-time recovery has lost
    its window. Nothing is down and no application data is harmed - the scratch
    collection is capped and bounded on disk. Reverting stops the churn; the oplog
    window then rebuilds gradually as normal writes age the burst entries out.
  category: reliability
  severity: high
  duration: 15m
  expectedSymptoms:
    - the MongoDB oplog window drops from many hours to a few minutes and stays there while the scenario runs, well under the safe threshold
    - the collapse is driven by oplog write throughput (bytes/second), not operation count - a small number of large writes per second churns the fixed-size oplog
    - the secondaries stay caught up (replication lag stays low) because the operation rate is low; the risk is the shrunken window itself, not a member currently falling behind
    - the tell is a small oplog window / high oplog byte-churn, meaning any restart, maintenance, or brief lag could push a member into a full resync, and PITR loses its margin - not an outage or a slow query
    - onset tracks the write churn; on revert the window rebuilds gradually (over ~an hour) as normal writes age the burst entries out
  actions:
    # High-bytes / low-ops insert churn into a capped collection on the primary.
    # The reviews user (readWrite on the reviews DB) is enough; credentials come
    # from the operator-generated Secret and are read from process.env. Deleting
    # the Job on revert stops the churn.
    - name: oplog-churn
      type: Workload
      workload:
        name: mongo-oplog-churn
        image: percona/percona-server-mongodb:7.0.39
        concurrency: 1
        env:
          - name: MONGO_USER
            value: reviews
          - name: MONGO_PW
            valueFrom:
              secretKeyRef:
                name: mongodb-custom-user-secret
                key: reviews
        command:
          - mongosh
          - --nodb
          - --quiet
          - --eval
          - |
            const u = encodeURIComponent(process.env.MONGO_USER);
            const p = encodeURIComponent(process.env.MONGO_PW);
            // writes go to the primary (default read/write preference)
            const uri = `mongodb://${u}:${p}@mongodb-rs0:27017/reviews?replicaSet=rs0&authSource=reviews`;
            const db = Mongo(uri).getDB('reviews');
            // a bounded (capped) scratch collection: inserts wrap around and
            // overwrite the oldest, so on-disk size stays ~128 MB no matter how
            // much we churn - only the oplog cycles
            try { db.createCollection('oplog_churn', { capped: true, size: 128 * 1024 * 1024 }); } catch (e) { /* already exists */ }
            const coll = db.getCollection('oplog_churn');
            const pad = 'x'.repeat(256 * 1024); // ~256 KB per document
            while (true) {
              try {
                // ~5 x 256 KB = ~1.28 MB of oplog per iteration; ~every 500ms =>
                // ~2.5 MB/s, which cycles the ~990 MB oplog in ~6-7 min and holds
                // the window at a few hundred seconds (well under the 1h threshold)
                const batch = [];
                for (let i = 0; i < 5; i++) batch.push({ t: new Date(), pad: pad });
                coll.insertMany(batch);
              } catch (e) {
                // brief backoff on a transient error (e.g. an election) before retrying
              }
              sleep(500);
            }
