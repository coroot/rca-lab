# A CPU-hungry batch job ("video-transcoder") lands on the same node as
# api-gateway (via pod affinity) and pegs the node's cores. api-gateway — an
# innocent tenant sharing that node — gets CPU-starved and slows down, even
# though nothing is wrong with api-gateway or its dependencies. Tests whether
# an RCA tool reasons about node-level resource contention / locality.
apiVersion: rcalab.dev/v1alpha1
kind: FailureScenario
metadata:
  name: cpu-noisy-neighbor
  namespace: default
spec:
  displayName: CPU noisy neighbor on the api-gateway node
  description: >-
    A batch "video-transcoder" workload is scheduled onto a node already
    running api-gateway and burns all spare CPU. api-gateway competes for CPU
    on that node and its latency rises, while its own dependencies (services,
    databases) are healthy — the cause is a co-located noisy neighbor, not
    anything in the request path.
  category: infra
  severity: medium
  duration: 10m
  expectedSymptoms:
    - node CPU saturates; api-gateway pods on that node are CFS-throttled
    - api-gateway latency rises while downstream services stay healthy
    - the culprit is a separate "video-transcoder" workload, not api-gateway
  actions:
    - name: video-transcoder
      type: Workload
      workload:
        name: video-transcoder
        image: busybox:1.36
        cpuBurn: 4
        concurrency: 2
        colocateWithApp: api-gateway
