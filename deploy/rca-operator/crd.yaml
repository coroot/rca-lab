---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: failurescenarios.rcalab.dev
spec:
  group: rcalab.dev
  names:
    kind: FailureScenario
    listKind: FailureScenarioList
    plural: failurescenarios
    shortNames:
    - fs
    singular: failurescenario
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.category
      name: Category
      type: string
    - jsonPath: .spec.severity
      name: Severity
      type: string
    - jsonPath: .spec.enabled
      name: Enabled
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          FailureScenario is a reproducible failure that the operator can inject and
          durably revert.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: FailureScenarioSpec defines the desired state of a FailureScenario.
            properties:
              actions:
                items:
                  description: Action is a single failure-injection step.
                  properties:
                    chaosMesh:
                      description: |-
                        ChaosMeshAction creates a Chaos Mesh custom resource (e.g. NetworkChaos,
                        StressChaos) verbatim and deletes it on revert. Chaos Mesh's own duration
                        field is set as a dead-man switch so the fault self-recovers if the operator
                        dies.
                      properties:
                        kind:
                          description: Kind of Chaos Mesh resource, e.g. NetworkChaos,
                            StressChaos.
                          minLength: 1
                          type: string
                        name:
                          description: Name of the created chaos object (defaults
                            to fs-<scenario>-<action>).
                          type: string
                        spec:
                          description: Spec is the Chaos Mesh object's .spec, passed
                            through verbatim.
                          x-kubernetes-preserve-unknown-fields: true
                      required:
                      - kind
                      - spec
                      type: object
                    delay:
                      description: Delay offsets this action's activation from the
                        run start.
                      type: string
                    deployImage:
                      description: |-
                        DeployImageAction rolls out a different image for one container of a
                        Deployment — a genuine version bump — and rolls it back on revert. The
                        known-good image is recorded in three places so the rollback is always
                        possible: the revert token in status, an annotation on the Deployment
                        itself, and (declaratively) this spec.
                      properties:
                        container:
                          description: Container is the container name within the
                            Deployment's pod template.
                          minLength: 1
                          type: string
                        image:
                          description: Image to deploy (the regression variant, plausibly
                            tagged).
                          minLength: 1
                          type: string
                        knownGoodImage:
                          description: |-
                            KnownGoodImage is the declarative rollback target. If empty, the image
                            observed at activation time is used.
                          type: string
                        rolloutTimeout:
                          description: |-
                            RolloutTimeout bounds how long Ensure reports "progressing" before the
                            action counts as applied anyway (a crash-looping bad deploy is a valid
                            scenario, not an error). Defaults to 5m.
                          type: string
                        targetRef:
                          description: ScaleTargetRef identifies the object a Scale
                            action operates on.
                          properties:
                            kind:
                              default: Deployment
                              enum:
                              - Deployment
                              type: string
                            name:
                              minLength: 1
                              type: string
                          required:
                          - kind
                          - name
                          type: object
                      required:
                      - container
                      - image
                      - targetRef
                      type: object
                    name:
                      description: Name is unique within the scenario.
                      minLength: 1
                      type: string
                    scale:
                      description: |-
                        ScaleAction scales a Deployment to a given replica count for the duration
                        of the run.
                      properties:
                        replicas:
                          format: int32
                          minimum: 0
                          type: integer
                        targetRef:
                          description: ScaleTargetRef identifies the object a Scale
                            action operates on.
                          properties:
                            kind:
                              default: Deployment
                              enum:
                              - Deployment
                              type: string
                            name:
                              minLength: 1
                              type: string
                          required:
                          - kind
                          - name
                          type: object
                      required:
                      - replicas
                      - targetRef
                      type: object
                    type:
                      enum:
                      - Workload
                      - Scale
                      - DeployImage
                      - ChaosMesh
                      type: string
                    workload:
                      description: WorkloadAction runs a database-load Job that looks
                        like a real workload.
                      properties:
                        colocateWithApp:
                          description: |-
                            ColocateWithApp schedules the workload onto nodes already running pods of
                            this app (label app=<value> in the same namespace) via podAffinity — a
                            realistic "noisy neighbor" that steals CPU from that app's node.
                          type: string
                        command:
                          description: Command overrides the generated dbtool arguments.
                          items:
                            type: string
                          type: array
                        concurrency:
                          default: 2
                          description: Concurrency is the number of parallel workers
                            (Job parallelism).
                          format: int32
                          minimum: 1
                          type: integer
                        cpuBurn:
                          description: |-
                            CPUBurn, when >0, runs this many busy-loop workers instead of dbtool (a
                            CPU hog). Requires image (e.g. busybox) and command, or defaults to a
                            shell busy-loop. Engine/Queries are ignored.
                          format: int32
                          type: integer
                        deadlineMargin:
                          description: |-
                            DeadlineMargin is added to the run duration to compute the Job's
                            activeDeadlineSeconds safety net. Defaults to 5m.
                          type: string
                        engine:
                          description: Engine selects the dbtool database driver.
                          enum:
                          - postgres
                          - mysql
                          type: string
                        env:
                          description: |-
                            Env is passed through to the workload container (DSN etc. via
                            secretKeyRef).
                          items:
                            description: EnvVar represents an environment variable
                              present in a Container.
                            properties:
                              name:
                                description: |-
                                  Name of the environment variable.
                                  May consist of any printable ASCII characters except '='.
                                type: string
                              value:
                                description: |-
                                  Variable references $(VAR_NAME) are expanded
                                  using the previously defined environment variables in the container and
                                  any service environment variables. If a variable cannot be resolved,
                                  the reference in the input string will be unchanged. Double $$ are reduced
                                  to a single $, which allows for escaping the $(VAR_NAME) syntax: i.e.
                                  "$$(VAR_NAME)" will produce the string literal "$(VAR_NAME)".
                                  Escaped references will never be expanded, regardless of whether the variable
                                  exists or not.
                                  Defaults to "".
                                type: string
                              valueFrom:
                                description: Source for the environment variable's
                                  value. Cannot be used if value is not empty.
                                properties:
                                  configMapKeyRef:
                                    description: Selects a key of a ConfigMap.
                                    properties:
                                      key:
                                        description: The key to select.
                                        type: string
                                      name:
                                        default: ""
                                        description: |-
                                          Name of the referent.
                                          This field is effectively required, but due to backwards compatibility is
                                          allowed to be empty. Instances of this type with an empty value here are
                                          almost certainly wrong.
                                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                        type: string
                                      optional:
                                        description: Specify whether the ConfigMap
                                          or its key must be defined
                                        type: boolean
                                    required:
                                    - key
                                    type: object
                                    x-kubernetes-map-type: atomic
                                  fieldRef:
                                    description: |-
                                      Selects a field of the pod: supports metadata.name, metadata.namespace, `metadata.labels['<KEY>']`, `metadata.annotations['<KEY>']`,
                                      spec.nodeName, spec.serviceAccountName, status.hostIP, status.podIP, status.podIPs.
                                    properties:
                                      apiVersion:
                                        description: Version of the schema the FieldPath
                                          is written in terms of, defaults to "v1".
                                        type: string
                                      fieldPath:
                                        description: Path of the field to select in
                                          the specified API version.
                                        type: string
                                    required:
                                    - fieldPath
                                    type: object
                                    x-kubernetes-map-type: atomic
                                  fileKeyRef:
                                    description: |-
                                      FileKeyRef selects a key of the env file.
                                      Requires the EnvFiles feature gate to be enabled.
                                    properties:
                                      key:
                                        description: |-
                                          The key within the env file. An invalid key will prevent the pod from starting.
                                          The keys defined within a source may consist of any printable ASCII characters except '='.
                                          During Alpha stage of the EnvFiles feature gate, the key size is limited to 128 characters.
                                        type: string
                                      optional:
                                        default: false
                                        description: |-
                                          Specify whether the file or its key must be defined. If the file or key
                                          does not exist, then the env var is not published.
                                          If optional is set to true and the specified key does not exist,
                                          the environment variable will not be set in the Pod's containers.

                                          If optional is set to false and the specified key does not exist,
                                          an error will be returned during Pod creation.
                                        type: boolean
                                      path:
                                        description: |-
                                          The path within the volume from which to select the file.
                                          Must be relative and may not contain the '..' path or start with '..'.
                                        type: string
                                      volumeName:
                                        description: The name of the volume mount
                                          containing the env file.
                                        type: string
                                    required:
                                    - key
                                    - path
                                    - volumeName
                                    type: object
                                    x-kubernetes-map-type: atomic
                                  resourceFieldRef:
                                    description: |-
                                      Selects a resource of the container: only resources limits and requests
                                      (limits.cpu, limits.memory, limits.ephemeral-storage, requests.cpu, requests.memory and requests.ephemeral-storage) are currently supported.
                                    properties:
                                      containerName:
                                        description: 'Container name: required for
                                          volumes, optional for env vars'
                                        type: string
                                      divisor:
                                        anyOf:
                                        - type: integer
                                        - type: string
                                        description: Specifies the output format of
                                          the exposed resources, defaults to "1"
                                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                                        x-kubernetes-int-or-string: true
                                      resource:
                                        description: 'Required: resource to select'
                                        type: string
                                    required:
                                    - resource
                                    type: object
                                    x-kubernetes-map-type: atomic
                                  secretKeyRef:
                                    description: Selects a key of a secret in the
                                      pod's namespace
                                    properties:
                                      key:
                                        description: The key of the secret to select
                                          from.  Must be a valid secret key.
                                        type: string
                                      name:
                                        default: ""
                                        description: |-
                                          Name of the referent.
                                          This field is effectively required, but due to backwards compatibility is
                                          allowed to be empty. Instances of this type with an empty value here are
                                          almost certainly wrong.
                                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                        type: string
                                      optional:
                                        description: Specify whether the Secret or
                                          its key must be defined
                                        type: boolean
                                    required:
                                    - key
                                    type: object
                                    x-kubernetes-map-type: atomic
                                type: object
                            required:
                            - name
                            type: object
                          type: array
                        image:
                          description: Image to run. Defaults to the operator's own
                            image (env OPERATOR_IMAGE).
                          type: string
                        interval:
                          description: |-
                            Interval is the pause between query-loop iterations per worker.
                            Defaults to 1s.
                          type: string
                        name:
                          description: |-
                            Name is the workload identity (Job name, app label, container name),
                            e.g. "analytics-reporting".
                          maxLength: 63
                          minLength: 1
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          type: string
                        queries:
                          description: Queries are SQL statements run in a loop by
                            dbtool.
                          items:
                            type: string
                          type: array
                      required:
                      - name
                      type: object
                  required:
                  - name
                  - type
                  type: object
                  x-kubernetes-validations:
                  - message: exactly one of workload/scale/deployImage/chaosMesh must
                      be set and must match type
                    rule: (self.type == 'Workload') == has(self.workload) && (self.type
                      == 'Scale') == has(self.scale) && (self.type == 'DeployImage')
                      == has(self.deployImage) && (self.type == 'ChaosMesh') == has(self.chaosMesh)
                minItems: 1
                type: array
              category:
                enum:
                - database
                - deploy
                - infra
                - app
                - network
                - kafka
                type: string
              description:
                type: string
              displayName:
                type: string
              duration:
                description: |-
                  Duration is the default hold time for enabled=true runs (auto-expiry).
                  Empty means hold until disabled.
                type: string
              enabled:
                default: false
                description: |-
                  Enabled holds the failure active while true (sticky). If duration is
                  set, the run auto-expires and the operator flips enabled back to false.
                type: boolean
              expectedSymptoms:
                description: |-
                  ExpectedSymptoms documents the telemetry an RCA tool should observe
                  (used for grading, not by the operator).
                items:
                  type: string
                type: array
              severity:
                enum:
                - low
                - medium
                - high
                type: string
              trigger:
                description: Trigger starts a one-shot manual run.
                properties:
                  duration:
                    description: Duration of the one-shot run. Falls back to spec.duration
                      if empty.
                    type: string
                  runID:
                    description: |-
                      RunID identifies the requested run. A NEW value (different from
                      status.lastCompletedRunID) starts a run.
                    type: string
                required:
                - runID
                type: object
            required:
            - actions
            - category
            - displayName
            - severity
            type: object
          status:
            description: FailureScenarioStatus defines the observed state of a FailureScenario.
            properties:
              activeActions:
                items:
                  description: |-
                    ActiveAction is the durable record of one injected (or in-flight) action.
                    The revert token is fully self-contained: reverting never consults spec.
                  properties:
                    appliedAt:
                      format: date-time
                      type: string
                    attempts:
                      format: int32
                      type: integer
                    lastError:
                      type: string
                    name:
                      type: string
                    phase:
                      enum:
                      - Recorded
                      - Applied
                      - Reverting
                      type: string
                    revert:
                      description: |-
                        Revert is the opaque, self-contained revert token persisted BEFORE any
                        mutation is made.
                      x-kubernetes-preserve-unknown-fields: true
                    type:
                      type: string
                  required:
                  - name
                  - phase
                  - revert
                  - type
                  type: object
                type: array
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              currentRun:
                description: CurrentRun describes the run in progress.
                properties:
                  expiresAt:
                    format: date-time
                    type: string
                  id:
                    type: string
                  startedAt:
                    format: date-time
                    type: string
                  trigger:
                    enum:
                    - Manual
                    - Enabled
                    type: string
                required:
                - id
                - startedAt
                - trigger
                type: object
              history:
                items:
                  description: RunHistoryEntry records a finished run.
                  properties:
                    endedAt:
                      format: date-time
                      type: string
                    id:
                      type: string
                    message:
                      type: string
                    result:
                      enum:
                      - Completed
                      - Reverted
                      - Failed
                      type: string
                    startedAt:
                      format: date-time
                      type: string
                    trigger:
                      type: string
                  required:
                  - id
                  - result
                  - startedAt
                  - trigger
                  type: object
                maxItems: 10
                type: array
              lastCompletedRunID:
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                default: Idle
                enum:
                - Idle
                - Activating
                - Active
                - Reverting
                - Degraded
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
