# Valkey, replicated: valkey-0 is the primary, valkey-1 replicates from it.
# The "valkey" Service pins to the primary pod (writes + reads); the headless
# service provides stable per-pod DNS for replication.
apiVersion: v1
kind: Service
metadata:
  name: valkey-headless
  namespace: default
  labels:
    app: valkey
spec:
  clusterIP: None
  selector:
    app: valkey
  ports:
    - name: valkey
      port: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: default
  labels:
    app: valkey
spec:
  selector:
    app: valkey
    statefulset.kubernetes.io/pod-name: valkey-0
  ports:
    - name: valkey
      port: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: valkey
  namespace: default
  labels:
    app: valkey
spec:
  serviceName: valkey-headless
  replicas: 2
  selector:
    matchLabels:
      app: valkey
  template:
    metadata:
      labels:
        app: valkey
    spec:
      containers:
        - name: valkey
          image: docker.io/valkey/valkey:9.1.1-alpine
          command:
            - sh
            - -c
            - |
              if [ "$(hostname)" = "valkey-0" ]; then
                exec valkey-server --appendonly yes
              else
                exec valkey-server --appendonly yes --replicaof valkey-0.valkey-headless 6379
              fi
          ports:
            - name: valkey
              containerPort: 6379
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
