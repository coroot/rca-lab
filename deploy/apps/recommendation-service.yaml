apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendation-service
  namespace: default
  labels:
    app: recommendation-service
    part-of: rca-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: recommendation-service
  template:
    metadata:
      labels:
        app: recommendation-service
        part-of: rca-lab
    spec:
      containers:
        - name: recommendation-service
          image: ghcr.io/coroot/rca-lab/recommendation-service:1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 9000
              name: grpc
          envFrom:
            - configMapRef:
                name: otel-env
          env:
            - name: OTEL_SERVICE_NAME
              value: recommendation-service
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            grpc:
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            grpc:
              port: 9000
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: recommendation-service
  namespace: default
  labels:
    app: recommendation-service
    part-of: rca-lab
spec:
  type: ClusterIP
  selector:
    app: recommendation-service
  ports:
    - port: 9000
      targetPort: 9000
      name: grpc
      protocol: TCP
