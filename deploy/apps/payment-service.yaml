apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: default
  labels:
    app: payment-service
    part-of: rca-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
        part-of: rca-lab
    spec:
      containers:
        - name: payment-service
          image: ghcr.io/coroot/rca-lab/payment-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: otel-env
          env:
            - name: OTEL_SERVICE_NAME
              value: payment-service
            # Discrete DB parts (not a URL): the operator-generated password
            # may contain URL-reserved characters.
            - name: MYSQL_HOST
              value: mysql-haproxy
            - name: MYSQL_PORT
              value: "3306"
            - name: MYSQL_USER
              value: payments
            - name: MYSQL_DATABASE
              value: payments
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-custom-user-secret
                  key: payments
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: default
  labels:
    app: payment-service
    part-of: rca-lab
spec:
  type: ClusterIP
  selector:
    app: payment-service
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
