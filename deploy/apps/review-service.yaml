apiVersion: apps/v1
kind: Deployment
metadata:
  name: review-service
  namespace: default
  labels:
    app: review-service
    part-of: rca-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: review-service
  template:
    metadata:
      labels:
        app: review-service
        part-of: rca-lab
    spec:
      containers:
        - name: review-service
          image: ghcr.io/coroot/rca-lab/review-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: otel-env
          env:
            - name: OTEL_SERVICE_NAME
              value: review-service
            # Credentials passed as driver options (see src/index.js), so the
            # URI carries no password (which may contain URI-breaking chars).
            - name: MONGODB_URI
              value: "mongodb://mongodb-rs0:27017/reviews?replicaSet=rs0&authSource=reviews&readPreference=secondaryPreferred"
            - name: MONGO_USER
              value: reviews
            - name: MONGO_AUTH_SOURCE
              value: reviews
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-custom-user-secret
                  key: reviews
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: review-service
  namespace: default
  labels:
    app: review-service
    part-of: rca-lab
spec:
  type: ClusterIP
  selector:
    app: review-service
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
