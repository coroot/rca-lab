# Vacuum freezing is blocked while transaction IDs are consumed fast, so
# age(datfrozenxid) climbs without bound toward the wraparound limit.
#
# Two things have to be true at once, and that is the whole point of the
# scenario. A held xmin horizon on its own (see sc-25) stalls freezing but the
# age barely moves, because normal traffic burns only a few hundred XIDs per
# second. Burning XIDs on its own does nothing either: at
# autovacuum_freeze_max_age Postgres forces anti-wraparound autovacuums, they
# succeed, and the age drops straight back. Only the combination escapes, and
# the escape is silent: nothing is slow, nothing errors, no user notices, and
# the database is quietly spending a budget that ends in a forced shutdown.
#
# How the XIDs are consumed, and why it is shaped this way. A transaction ID
# is consumed per SUBtransaction as well as per transaction, so the loader
# wraps each row in its own savepoint (the plpgsql BEGIN/EXCEPTION block) and
# commits every 64 rows. That is a real and common batch-loader anti-pattern,
# written for per-row error isolation, and it is exactly what makes XID
# consumption run away: 65 IDs per commit instead of 1.
#
# It is also what makes the scenario practical. Measured on this cluster, with
# the holder pinned and application traffic continuing:
#
#   savepoints per commit      1        16        64
#   XIDs/sec                  65k      103k      112k
#   WAL bytes per XID        57.7      12.9       9.1
#
# A plain commit-per-XID loop is commit-throughput bound (~34k/s) and does not
# scale with concurrency, so batching, not parallelism, is the lever. Hence
# concurrency 2 rather than more.
#
# Do NOT raise the batch above 64. PGPROC_MAX_CACHED_SUBXIDS is 64, and a
# backend that exceeds it is marked overflowed, which forces OTHER backends to
# consult pg_subtrans during visibility checks. That would slow the
# application and manufacture a user-visible symptom this scenario is
# specifically supposed not to have. (Throughput itself does not fall off a
# cliff past 64, measured 80 and 128 at ~106-112k/s; the reason to stay at 64
# is the effect on everyone else.) The related trap is unbounded accumulation:
# millions of savepoints inside ONE long transaction collapses to 849 XIDs/sec.
# Committing every 64 keeps the subxid list short, which is what avoids it.
#
# At ~112k/s the age grows 1:1 with consumption, because freezing is blocked:
#   TARGET_AGE       % of 2^31   time      WAL
#   230,000,000        10.7%     ~27 min   1.6 GB   needs threshold at 10%
#   1,100,000,000      51.2%     ~156 min  9.2 GB   fires the SHIPPED default
#
# TARGET_AGE (the second argument to sc27_burn_xids in action a3) is the knob,
# set to 230,000,000: just past Postgres's own escalation point of
# autovacuum_freeze_max_age (200M). Coroot's "Postgres transaction ID
# wraparound" check reports age as a percentage of 2^31 and ships with a 50%
# threshold, so at this target the project threshold must be set to 10% for the
# check to fire. Raising TARGET_AGE to 1,100,000,000 instead fires the shipped
# default with no Coroot configuration at all, at the cost of a 2.5 hour run;
# both now fit the backup repo, which had ~28 GB free when this was written.
apiVersion: maintenance.platform.dev/v1alpha1
kind: MaintenanceJob
metadata:
  name: sc-27
  namespace: default
spec:
  displayName: Transaction ID wraparound risk (freezing blocked)
  description: >-
    A "reporting" session opens a REPEATABLE READ transaction, takes its
    snapshot and stalls, pinning the global xmin horizon so vacuum can no longer
    advance datfrozenxid. At the same time a batch loader wraps every row in its
    own savepoint for per-row error isolation and commits in batches, so each
    commit spends 65 transaction IDs rather than 1 and the job consumes ~112k
    IDs per second. Because freezing is blocked, every one of those
    IDs is permanent progress toward wraparound: age(datfrozenxid) climbs
    steadily and never falls back. Past autovacuum_freeze_max_age Postgres
    starts forcing anti-wraparound autovacuums on every table; they run, they
    report success, and they still cannot advance the horizon, which is the
    detail that makes this so easy to misread. Nothing is slow and no user is
    affected, so the only signal is the age itself. Reverting terminates the
    stalled session; the horizon advances, the next vacuum freezes, and the age
    collapses back to roughly vacuum_freeze_min_age.
  category: reliability
  icon: postgres
  duration: 45m
  expectedSymptoms:
    - age(datfrozenxid) climbs steadily by roughly 6.7M per minute and never falls back, while data volume, query rate and latency are all unchanged
    - the xmin horizon breakdown attributes the hold to a running transaction (not a replication slot, standby feedback or prepared transaction), with a backend_xmin age tracking the xid age
    - autovacuum runs and reports success, yet datfrozenxid does not advance, because vacuum cannot freeze anything newer than the pinned snapshot
    - past autovacuum_freeze_max_age (200M here) Postgres escalates to forced anti-wraparound autovacuums on every table; they complete and still change nothing
    - "transaction ID consumption (~112k/sec) vastly exceeds the commit rate (~1.7k/sec), which is the fingerprint of per-row savepoints: each commit spends 65 IDs, not 1"
    - "no user-visible symptom at all, no latency change, no errors, no lock contention. That absence is the point: the only tell is the age, and the clock is running toward a forced database shutdown"
    - terminating the stalled session (revert) lets the next vacuum advance datfrozenxid, and the age drops to about vacuum_freeze_min_age (50M) within a few minutes
  actions:
    # 1. The XID burner, as a stored procedure so the loop runs entirely
    #    server-side: one CALL burns for a minute with no client round trips.
    #    Transaction control inside a procedure needs the CALL to be the only
    #    statement in the request, which is how dbtool issues it.
    #    The target-age check makes the burn self-limiting: once the age is
    #    reached the procedure returns immediately, so the scenario holds the
    #    state for the rest of its duration without generating more WAL. The
    #    modulo keeps that catalog lookup off the hot path.
    #    synchronous_commit is set per-session, not globally, so the burner's
    #    commits skip the fsync wait while application writes are unaffected.
    #    NOTE the $proc$ dollar-quote tag. Queries reach dbtool as container
    #    args, and Kubernetes rewrites "$$" to a literal "$" there, so a plain
    #    $$-quoted body arrives at Postgres broken ("syntax error at or near
    #    $"). A named tag has no adjacent dollars and survives untouched.
    - name: a1
      type: DBExec
      dbExec:
        name: sc-27-setup
        engine: postgres
        env:
          - name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: pg-pguser-products
                key: uri
        ensure:
          - "CREATE UNLOGGED TABLE IF NOT EXISTS sc27_staging(id int)"
          - >-
            CREATE OR REPLACE PROCEDURE sc27_burn_xids(target_age bigint, max_secs int)
            LANGUAGE plpgsql AS $proc$
            DECLARE t0 timestamptz := clock_timestamp(); k bigint := 0;
            BEGIN
            PERFORM set_config('synchronous_commit','off',false);
            WHILE clock_timestamp() - t0 < make_interval(secs => max_secs) LOOP
            IF k % 1000 = 0 AND (SELECT max(age(datfrozenxid)) FROM pg_database) >= target_age THEN
            RETURN;
            END IF;
            FOR j IN 1..64 LOOP
            BEGIN
            INSERT INTO sc27_staging VALUES (1);
            EXCEPTION WHEN OTHERS THEN NULL;
            END;
            END LOOP;
            COMMIT;
            k := k + 1;
            IF k % 2000 = 0 THEN
            TRUNCATE sc27_staging;
            COMMIT;
            END IF;
            END LOOP;
            END $proc$;
        revert:
          - "DROP PROCEDURE IF EXISTS sc27_burn_xids(bigint, int)"
          - "DROP TABLE IF EXISTS sc27_staging"

    # 2. The holder. REPEATABLE READ takes its snapshot at the first query and
    #    keeps it, which is what pins the horizon. pg_sleep outlasts the run
    #    (3000s > the 45m duration) so the transaction never ends on its own
    #    and the snapshot is never refreshed. If it were, datfrozenxid would
    #    start advancing again and the age would collapse mid-run. A sleeping
    #    backend does no socket IO and so will not notice its client pod dying,
    #    which is why action 4 terminates it explicitly.
    - name: a2
      type: Workload
      workload:
        name: sc-27-w1
        engine: postgres
        concurrency: 1
        interval: 10s
        env:
          - name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: pg-pguser-products
                key: uri
        queries:
          - "SET application_name = 'sc-27-holder'; BEGIN ISOLATION LEVEL REPEATABLE READ; SELECT count(*) FROM products; SELECT pg_sleep(3000);"

    # 3. The runaway batch job. Delayed so the horizon is pinned before the
    #    first XID is spent, otherwise early progress is simply frozen away.
    #    concurrency is 2 because that is the measured ceiling: this is bound by
    #    commit throughput, and more workers do not go faster.
    - name: a3
      type: Workload
      delay: 20s
      workload:
        name: sc-27-w2
        engine: postgres
        concurrency: 2
        interval: 1s
        env:
          - name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: pg-pguser-products
                key: uri
        queries:
          - "CALL sc27_burn_xids(230000000::bigint, 60)"

    # 4. Deterministic release. Mutates nothing on activation (the ensure is a
    #    no-op probe); its whole purpose is the revert. Reverts run LIFO, so
    #    this one goes first and releases the horizon before the burner and
    #    holder Jobs are torn down. Idempotent: matches zero rows if the holder
    #    is already gone.
    - name: a4
      type: DBExec
      dbExec:
        name: sc-27-w3
        engine: postgres
        env:
          - name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: pg-pguser-products
                key: uri
        ensure:
          - "SELECT 1"
        revert:
          - "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE application_name = 'sc-27-holder' AND pid <> pg_backend_pid()"
