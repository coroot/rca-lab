apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: default
  labels:
    app: order-service
    part-of: rca-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
        part-of: rca-lab
    spec:
      containers:
        - name: order-service
          image: ghcr.io/coroot/rca-lab/order-service:1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: otel-env
          env:
            - name: OTEL_SERVICE_NAME
              value: order-service
            # Database "orders" is created by the mysql-init Job; the user is
            # declarative on the PerconaXtraDBCluster with an operator-generated
            # password in Secret mysql-custom-user-secret (key = username).
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql-haproxy:3306/orders?sslMode=PREFERRED&allowPublicKeyRetrieval=true"
            - name: SPRING_DATASOURCE_USERNAME
              value: orders
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-custom-user-secret
                  key: orders
            - name: PAYMENT_SERVICE_URL
              value: http://payment-service:8080
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka-kafka-bootstrap:9092
          # NOTE on JVM sizing: the image sets JAVA_TOOL_OPTIONS=-javaagent:...
          # (OTel javaagent), so JAVA_TOOL_OPTIONS must not be overridden here,
          # and the image entrypoint hardcodes -Xmx1g (it does not read
          # JAVA_OPTS). The memory limit therefore leaves headroom above the 1g
          # heap instead of pinning to 768Mi.
          resources:
            requests:
              cpu: 200m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 1536Mi
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: default
  labels:
    app: order-service
    part-of: rca-lab
spec:
  type: ClusterIP
  selector:
    app: order-service
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
